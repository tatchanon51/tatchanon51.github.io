<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C3002F"/>
      <stop offset="100%" stop-color="#8B0020"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5775"/>
      <stop offset="100%" stop-color="#2a3550"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg1)"/>
  
  <!-- Subtle ground reflection -->
  <ellipse cx="300" cy="240" rx="240" ry="10" fill="rgba(195,0,47,0.2)"/>
  
  <!-- Nissan KICKS silhouette (modern crossover) -->
  <g transform="translate(100, 90)">
    <!-- Main body -->
    <path d="M 0 120 L 0 80 Q 10 50 40 45 L 80 35 Q 130 15 200 15 L 340 15 Q 390 15 410 45 L 400 80 L 400 120 Z" fill="url(#body)" stroke="#8B0020" stroke-width="2"/>
    
    <!-- Window area -->
    <path d="M 70 50 L 100 30 Q 130 20 200 20 L 340 20 Q 370 25 390 50 L 70 55 Z" fill="url(#window)" opacity="0.9"/>
    
    <!-- Window divider -->
    <line x1="200" y1="20" x2="200" y2="55" stroke="#1a1a2e" stroke-width="2"/>
    
    <!-- Side character line -->
    <line x1="0" y1="80" x2="400" y2="80" stroke="#FFD54F" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Headlights -->
    <rect x="380" y="65" width="20" height="12" fill="#FFD54F" rx="3"/>
    
    <!-- Door handles -->
    <rect x="140" y="85" width="14" height="3" fill="#FFD54F" opacity="0.7"/>
    <rect x="240" y="85" width="14" height="3" fill="#FFD54F" opacity="0.7"/>
    
    <!-- Wheels -->
    <circle cx="80" cy="125" r="25" fill="#0a0a14" stroke="#FFD54F" stroke-width="2"/>
    <circle cx="80" cy="125" r="11" fill="#1a1a2e" stroke="#C3002F" stroke-width="1"/>
    <circle cx="80" cy="125" r="3" fill="#FFD54F"/>
    
    <circle cx="320" cy="125" r="25" fill="#0a0a14" stroke="#FFD54F" stroke-width="2"/>
    <circle cx="320" cy="125" r="11" fill="#1a1a2e" stroke="#C3002F" stroke-width="1"/>
    <circle cx="320" cy="125" r="3" fill="#FFD54F"/>
    
    <!-- Wheel arches -->
    <path d="M 55 120 Q 80 100 105 120" fill="none" stroke="#0a0a14" stroke-width="2"/>
    <path d="M 295 120 Q 320 100 345 120" fill="none" stroke="#0a0a14" stroke-width="2"/>
    
    <!-- Grille hint -->
    <rect x="385" y="85" width="12" height="20" fill="#FFD54F" opacity="0.4" rx="2"/>
  </g>
  
  <!-- Brand name -->
  <text x="300" y="270" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white" letter-spacing="3">NISSAN KICKS e-POWER</text>
  <text x="300" y="285" text-anchor="middle" font-family="Arial" font-size="10" fill="#C3002F" letter-spacing="2">PREMIUM COMPACT SUV</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#F8F8F8" rx="8"/>
  
  <!-- Facebook Circle -->
  <circle cx="100" cy="125" r="60" fill="#1877F2"/>
  <text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="42" font-weight="800" fill="white">f</text>
  <text x="100" y="205" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1E1E1E">Facebook</text>
  <text x="100" y="222" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Lead Form · Community</text>
  
  <!-- TikTok Circle -->
  <circle cx="300" cy="125" r="60" fill="#000000"/>
  <text x="300" y="140" text-anchor="middle" font-family="Arial" font-size="42" font-weight="800" fill="white">♪</text>
  <text x="300" y="205" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1E1E1E">TikTok</text>
  <text x="300" y="222" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Reels · Discovery</text>
  
  <!-- Connection -->
  <line x1="160" y1="125" x2="240" y2="125" stroke="#C3002F" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="200" y="115" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">CROSS</text>
  <text x="200" y="135" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">PROMOTE</text>
</svg>

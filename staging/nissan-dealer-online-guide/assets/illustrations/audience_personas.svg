<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#F8F8F8" rx="8"/>
  
  <!-- 3 Persona Avatars -->
  <circle cx="100" cy="80" r="35" fill="#FFD54F"/>
  <text x="100" y="92" text-anchor="middle" font-size="32">👤</text>
  <text x="100" y="135" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E1E1E">Cold</text>
  <text x="100" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">อายุ 25-35</text>
  
  <circle cx="200" cy="80" r="35" fill="#FFA726"/>
  <text x="200" y="92" text-anchor="middle" font-size="32">👥</text>
  <text x="200" y="135" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E1E1E">Warm</text>
  <text x="200" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">อายุ 30-45</text>
  
  <circle cx="300" cy="80" r="35" fill="#E55B30"/>
  <text x="300" y="92" text-anchor="middle" font-size="32">🛒</text>
  <text x="300" y="135" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E1E1E">Hot</text>
  <text x="300" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">พร้อมซื้อ</text>
  
  <!-- Funnel arrow -->
  <path d="M 50 200 L 350 200" stroke="#C3002F" stroke-width="3" marker-end="url(#a)"/>
  <text x="200" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">Conversion Funnel: 75% → 5%</text>
  
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#C3002F"/>
    </marker>
  </defs>
</svg>

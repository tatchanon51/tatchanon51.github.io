<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#F8F8F8" rx="8"/>
  
  <!-- Organic Side -->
  <rect x="20" y="20" width="170" height="160" fill="white" stroke="#C3002F" stroke-width="2" rx="8"/>
  <text x="105" y="50" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#C3002F">🌱 ORGANIC</text>
  
  <circle cx="105" cy="95" r="35" fill="#C3002F" opacity="0.15"/>
  <text x="105" y="100" text-anchor="middle" font-size="22">📱</text>
  
  <text x="105" y="150" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#1E1E1E">Free · Slow</text>
  <text x="105" y="165" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#1E1E1E">Trust Building</text>
  
  <!-- Paid Side -->
  <rect x="210" y="20" width="170" height="160" fill="#C3002F" rx="8"/>
  <text x="295" y="50" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">💰 PAID</text>
  
  <circle cx="295" cy="95" r="35" fill="white" opacity="0.2"/>
  <text x="295" y="100" text-anchor="middle" font-size="22">🎯</text>
  
  <text x="295" y="150" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="white">Budget · Fast</text>
  <text x="295" y="165" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="white">Targeting</text>
  
  <!-- VS divider -->
  <circle cx="200" cy="100" r="20" fill="white" stroke="#1E1E1E" stroke-width="2"/>
  <text x="200" y="106" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#1E1E1E">VS</text>
</svg>

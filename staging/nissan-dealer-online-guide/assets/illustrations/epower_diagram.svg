<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="epower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="engine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C3002F"/>
      <stop offset="100%" stop-color="#8B0020"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="300" fill="url(#epower)"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">⚡ e-POWER System — EV-like, ไม่ต้องชาร์จ</text>
  
  <!-- Engine Block -->
  <rect x="50" y="80" width="120" height="120" fill="url(#engine)" rx="8"/>
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">⛽ ENGINE</text>
  <text x="110" y="135" text-anchor="middle" font-family="Arial" font-size="11" fill="white">1.5L VC-Turbo</text>
  <text x="110" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Generate Electricity</text>
  <text x="110" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Only</text>
  
  <!-- Battery -->
  <rect x="240" y="80" width="120" height="120" fill="#FFD54F" rx="8"/>
  <text x="300" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1E1E1E">🔋 BATTERY</text>
  <text x="300" y="135" text-anchor="middle" font-family="Arial" font-size="11" fill="#1E1E1E">Small Buffer</text>
  <text x="300" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#1E1E1E">Energy Storage</text>
  <text x="300" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="#1E1E1E">(2 kWh)</text>
  
  <!-- Motor -->
  <rect x="430" y="80" width="120" height="120" fill="#1877F2" rx="8"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">⚙️ MOTOR</text>
  <text x="490" y="135" text-anchor="middle" font-family="Arial" font-size="11" fill="white">EM14 Electric</text>
  <text x="490" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Drive Wheels</text>
  <text x="490" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="white">100% EV Drive</text>
  
  <!-- Arrows -->
  <path d="M 170 130 L 230 130" stroke="white" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Energy</text>
  
  <path d="M 360 130 L 420 130" stroke="white" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="390" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Power</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white"/>
    </marker>
  </defs>
  
  <!-- Bottom benefits -->
  <rect x="50" y="225" width="500" height="50" fill="rgba(255,255,255,0.1)" rx="4"/>
  <text x="300" y="245" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#FFD54F">✓ EV-like Drive  ✓ No Plug  ✓ Quiet  ✓ 23 km/L  ✓ Turbo Power</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#F8F8F8" rx="8"/>
  
  <!-- 3 Stages Ecosystem -->
  <circle cx="80" cy="100" r="40" fill="#1877F2"/>
  <text x="80" y="108" text-anchor="middle" font-size="26" fill="white">📱</text>
  <text x="80" y="160" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E1E1E">TikTok</text>
  
  <circle cx="200" cy="100" r="40" fill="#C3002F"/>
  <text x="200" y="108" text-anchor="middle" font-size="26" fill="white">📣</text>
  <text x="200" y="160" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E1E1E">Facebook</text>
  
  <circle cx="320" cy="100" r="40" fill="#42B72A"/>
  <text x="320" y="108" text-anchor="middle" font-size="26" fill="white">💬</text>
  <text x="320" y="160" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E1E1E">LINE OA</text>
  
  <!-- Connections -->
  <line x1="125" y1="100" x2="155" y2="100" stroke="#C3002F" stroke-width="3"/>
  <polygon points="155,95 165,100 155,105" fill="#C3002F"/>
  
  <line x1="245" y1="100" x2="275" y2="100" stroke="#C3002F" stroke-width="3"/>
  <polygon points="275,95 285,100 275,105" fill="#C3002F"/>
  
  <text x="200" y="40" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">🔄 Cross-Promote Loop</text>
</svg>
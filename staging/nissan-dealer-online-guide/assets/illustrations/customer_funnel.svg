<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="funnel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C3002F"/>
      <stop offset="100%" stop-color="#8B0020"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#F8F8F8" rx="8"/>
  
  <!-- Funnel Stage 1: Awareness (Widest) -->
  <rect x="50" y="40" width="300" height="40" fill="url(#funnel)" opacity="0.95" rx="4"/>
  <text x="200" y="65" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">AWARENESS</text>
  <text x="370" y="65" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">100%</text>
  
  <!-- Funnel Stage 2: Interest -->
  <rect x="90" y="100" width="220" height="40" fill="url(#funnel)" opacity="0.85" rx="4"/>
  <text x="200" y="125" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">INTEREST</text>
  <text x="330" y="125" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">60%</text>
  
  <!-- Funnel Stage 3: Consideration -->
  <rect x="130" y="160" width="140" height="40" fill="url(#funnel)" opacity="0.7" rx="4"/>
  <text x="200" y="185" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="white">CONSIDER</text>
  <text x="290" y="185" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">30%</text>
  
  <!-- Funnel Stage 4: Intent/Lead -->
  <rect x="160" y="220" width="80" height="40" fill="url(#funnel)" opacity="0.55" rx="4"/>
  <text x="200" y="245" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="white">LEAD</text>
  <text x="260" y="245" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">10%</text>
  
  <!-- Arrow indicating flow -->
  <path d="M 200 30 L 200 38" stroke="#C3002F" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#C3002F"/>
    </marker>
  </defs>
</svg>

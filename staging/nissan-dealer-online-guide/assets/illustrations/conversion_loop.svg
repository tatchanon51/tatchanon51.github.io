<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#F8F8F8" rx="8"/>
  
  <!-- Loop arrows -->
  <circle cx="200" cy="100" r="70" fill="none" stroke="#C3002F" stroke-width="3" stroke-dasharray="8,6"/>
  
  <!-- Step 1: Post -->
  <circle cx="130" cy="100" r="30" fill="#1877F2"/>
  <text x="130" y="107" text-anchor="middle" font-size="22" fill="white">📱</text>
  <text x="130" y="155" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1E1E1E">POST</text>
  
  <!-- Step 2: Engage -->
  <circle cx="200" cy="50" r="30" fill="#42B72A"/>
  <text x="200" y="57" text-anchor="middle" font-size="22" fill="white">💬</text>
  <text x="200" y="22" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1E1E1E">ENGAGE</text>
  
  <!-- Step 3: Boost -->
  <circle cx="270" cy="100" r="30" fill="#C3002F"/>
  <text x="270" y="107" text-anchor="middle" font-size="22" fill="white">🚀</text>
  <text x="270" y="155" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1E1E1E">BOOST</text>
  
  <!-- Step 4: Convert -->
  <circle cx="200" cy="150" r="30" fill="#FFA726"/>
  <text x="200" y="157" text-anchor="middle" font-size="22" fill="white">🎯</text>
  <text x="200" y="190" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1E1E1E">CONVERT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F8F8"/>
    </linearGradient>
    <linearGradient id="nissanRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C3002F"/>
      <stop offset="100%" stop-color="#8B0020"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Connecting flow line -->
  <path d="M 100 200 Q 300 200 300 200 T 1100 200" stroke="url(#nissanRed)" stroke-width="3" fill="none" stroke-dasharray="6,4"/>
  
  <!-- Stage 1: Awareness (Phone) -->
  <circle cx="100" cy="200" r="55" fill="#1877F2"/>
  <text x="100" y="195" text-anchor="middle" font-size="36">📱</text>
  <text x="100" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="white">REACH</text>
  <text x="100" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#1E1E1E">1. AWARENESS</text>
  <text x="100" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Facebook · TikTok</text>
  <text x="100" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">100% Reach</text>
  
  <!-- Arrow 1 -->
  <text x="200" y="195" text-anchor="middle" font-size="20" fill="#C3002F">→</text>
  
  <!-- Stage 2: Interest (Heart/Comment) -->
  <circle cx="280" cy="200" r="55" fill="#C3002F"/>
  <text x="280" y="195" text-anchor="middle" font-size="36">❤️</text>
  <text x="280" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="white">LIKE</text>
  <text x="280" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#1E1E1E">2. INTEREST</text>
  <text x="280" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Comments · Shares</text>
  <text x="280" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">~30% Engagement</text>
  
  <text x="380" y="195" text-anchor="middle" font-size="20" fill="#C3002F">→</text>
  
  <!-- Stage 3: Car Image -->
  <circle cx="460" cy="200" r="55" fill="#1E1E1E"/>
  <text x="460" y="210" text-anchor="middle" font-size="36">🚗</text>
  <text x="460" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#1E1E1E">3. CONSIDER</text>
  <text x="460" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">View Specs · Reviews</text>
  <text x="460" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">~10% Browsing</text>
  
  <text x="560" y="195" text-anchor="middle" font-size="20" fill="#C3002F">→</text>
  
  <!-- Stage 4: Lead Form -->
  <circle cx="640" cy="200" r="55" fill="#42B72A"/>
  <text x="640" y="195" text-anchor="middle" font-size="36">📋</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="white">LEAD</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#1E1E1E">4. LEAD</text>
  <text x="640" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Lead Form · Test Drive</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">~3% Conversion</text>
  
  <text x="740" y="195" text-anchor="middle" font-size="20" fill="#C3002F">→</text>
  
  <!-- Stage 5: Dealer -->
  <circle cx="820" cy="200" r="55" fill="#FFA726"/>
  <text x="820" y="195" text-anchor="middle" font-size="36">🏪</text>
  <text x="820" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="white">VISIT</text>
  <text x="820" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#1E1E1E">5. DEALER</text>
  <text x="820" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Showroom Visit</text>
  <text x="820" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">~1.5% Visit</text>
  
  <text x="920" y="195" text-anchor="middle" font-size="20" fill="#C3002F">→</text>
  
  <!-- Stage 6: Sale -->
  <circle cx="1000" cy="200" r="55" fill="#8B0020"/>
  <text x="1000" y="195" text-anchor="middle" font-size="36">🏆</text>
  <text x="1000" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="white">SALE</text>
  <text x="1000" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#1E1E1E">6. PURCHASE</text>
  <text x="1000" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Close · Deliver</text>
  <text x="1000" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">~1% Closed</text>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#1E1E1E">🚗 Nissan Customer Journey — 6 Stages from Reach to Sale</text>
  <text x="600" y="75" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">100% Reach → 30% Engage → 10% Browse → 3% Lead → 1.5% Visit → 1% Close</text>
  
  <!-- Bottom info bar -->
  <rect x="100" y="350" width="1000" height="30" fill="#F0F0F0" rx="4"/>
  <text x="600" y="370" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#C3002F">💡 Each Stage = Different Content · Different KPI · Different Budget</text>
</svg>
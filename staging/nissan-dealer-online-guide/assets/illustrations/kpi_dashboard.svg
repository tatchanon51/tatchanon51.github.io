<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#F8F8F8" rx="8"/>
  
  <!-- KPI Cards -->
  <rect x="20" y="40" width="80" height="120" fill="white" stroke="#C3002F" stroke-width="2" rx="6"/>
  <text x="60" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">CTR</text>
  <text x="60" y="100" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#C3002F">2%</text>
  <text x="60" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#1E1E1E">≥1.5%</text>
  <text x="60" y="150" text-anchor="middle" font-size="20">👆</text>
  
  <rect x="115" y="40" width="80" height="120" fill="white" stroke="#1877F2" stroke-width="2" rx="6"/>
  <text x="155" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">CPC</text>
  <text x="155" y="100" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#1877F2">5฿</text>
  <text x="155" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#1E1E1E">≤15฿</text>
  <text x="155" y="150" text-anchor="middle" font-size="20">💵</text>
  
  <rect x="210" y="40" width="80" height="120" fill="white" stroke="#42B72A" stroke-width="2" rx="6"/>
  <text x="250" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">CPL</text>
  <text x="250" y="100" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#42B72A">150฿</text>
  <text x="250" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#1E1E1E">≤400฿</text>
  <text x="250" y="150" text-anchor="middle" font-size="20">📋</text>
  
  <rect x="305" y="40" width="80" height="120" fill="white" stroke="#FFA726" stroke-width="2" rx="6"/>
  <text x="345" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">ROAS</text>
  <text x="345" y="100" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFA726">3.5x</text>
  <text x="345" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#1E1E1E">≥2x</text>
  <text x="345" y="150" text-anchor="middle" font-size="20">📈</text>
  
  <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E1E1E">📊 Meta Ads KPI Dashboard</text>
</svg>
  <circle cx="340" cy="80" r="18" fill="#FFA726"/>
  <text x="340" y="86" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">50s</text>
  <text x="340" y="115" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1E1E1E">CTA</text>
